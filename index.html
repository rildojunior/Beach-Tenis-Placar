<!doctype html>
<html class="dark" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#17cfcf',
              'accent-orange': '#FC5D24',
              'background-dark': '#16181d',
              'card-dark': '#232529'
            },
            fontFamily: {
              display: ['Spline Sans', 'sans-serif']
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="style.css" />

    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16181d">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">


    <title>Beach Tennis Pro</title>
  </head>

  <body
    class="bg-background-dark font-display text-white min-h-screen flex flex-col"
  >
<header class="p-4 max-w-md mx-auto w-full grid grid-cols-3 items-center">
  
  <!-- Espaço vazio (equilíbrio visual) -->
  <div></div>

  <!-- Título centralizado de verdade -->
  <div class="text-center">
    <h1 class="font-black uppercase tracking-tight">Beach Tennis</h1>
    <span class="text-primary text-xs tracking-widest">LIVE MATCH</span>
  </div>

  <!-- Botão de configurações -->
  <div class="flex justify-end">
    <button onclick="openSettings()"
      class="p-2 rounded-xl bg-white/5 hover:bg-white/10 transition">
      <span class="material-symbols-outlined text-xl">settings</span>
    </button>
  </div>

</header>


    <main class="flex-1 max-w-md mx-auto w-full">
      <section class="px-6 py-4">
        <div class="bg-card-dark/60 rounded-2xl p-4 text-center">
          <h3
            class="text-primary text-xs font-bold tracking-[0.3em] uppercase mb-3"
          >
            Pontuação dos Sets
          </h3>

          <div class="flex items-center justify-center gap-8">
            <div class="text-center">
              <div id="setsA" class="text-4xl font-black">0</div>
              <span id="teamNameASet"
  class="text-[10px] opacity-50 uppercase">
  Time A
</span>

            </div>

            <div class="h-10 w-px bg-white/10 rounded-full"></div>

            <div class="text-center">
              <div id="setsB" class="text-4xl font-black">0</div>
              <span id="teamNameBSet"
  class="text-[10px] opacity-50 uppercase">
  Time B
</span>

            </div>
          </div>
        </div>
      </section>

      <section class="px-4 py-2">
        <h4
          class="text-center text-xs tracking-[0.3em] opacity-40 uppercase mb-4"
        >
          Pontuação da Partida
        </h4>

        <div class="flex gap-3">
          <div
            id="cardA"
            class="flex-1 bg-card-dark rounded-3xl p-6 flex flex-col items-center border-b-4 border-primary transition-all"
          >
            <span id="teamNameA"
  contenteditable="true"
  spellcheck="false"
  class="text-primary text-xs uppercase font-bold focus:outline-none">
  Time A
</span>
            <div class="flex-1 flex items-center justify-center">
              <span id="pointsA" class="text-7xl font-black">0</span>
            </div>
            <div class="flex gap-1 mt-2">
              <div class="progressA h-1.5 w-6 rounded-full bg-white/10"></div>
              <div class="progressA h-1.5 w-6 rounded-full bg-white/10"></div>
              <div class="progressA h-1.5 w-6 rounded-full bg-white/10"></div>
              <div class="progressA h-1.5 w-6 rounded-full bg-white/10"></div>
            </div>
          </div>

          <div
            id="cardB"
            class="flex-1 bg-card-dark rounded-3xl p-6 flex flex-col items-center border-b-4 border-accent-orange transition-all"
          >
          <span id="teamNameB"
  contenteditable="true"
  spellcheck="false"
  class="text-accent-orange text-xs uppercase font-bold focus:outline-none">
  Time B
</span>

            <div class="flex-1 flex items-center justify-center">
              <span id="pointsB" class="text-7xl font-black">0</span>
            </div>
            <div class="flex gap-1 mt-2">
              <div class="progressB h-1.5 w-6 rounded-full bg-white/10"></div>
              <div class="progressB h-1.5 w-6 rounded-full bg-white/10"></div>
              <div class="progressB h-1.5 w-6 rounded-full bg-white/10"></div>
              <div class="progressB h-1.5 w-6 rounded-full bg-white/10"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="px-6 pb-8 mt-6">
        <div class="grid grid-cols-2 gap-6">
          <div class="flex flex-col gap-3">
            <button
              onclick="addPoint('A')"
              class="w-full aspect-square flex items-center justify-center bg-primary rounded-3xl text-background-dark shadow-lg shadow-primary/20 active:scale-95 transition-transform"
            >
              <span class="material-symbols-outlined text-5xl font-bold"
                >add</span
              >
            </button>
            <button
              onclick="removePoint('A')"
              class="w-full py-3 flex items-center justify-center bg-white/5 rounded-xl text-white/40 active:bg-white/10 transition-colors"
            >
              <span class="material-symbols-outlined">remove</span>
            </button>
          </div>

          <div class="flex flex-col gap-3">
            <button
              onclick="addPoint('B')"
              class="w-full aspect-square flex items-center justify-center bg-accent-orange rounded-3xl text-white shadow-lg shadow-accent-orange/20 active:scale-95 transition-transform"
            >
              <span class="material-symbols-outlined text-5xl font-bold"
                >add</span
              >
            </button>
            <button
              onclick="removePoint('B')"
              class="w-full py-3 flex items-center justify-center bg-white/5 rounded-xl text-white/40 active:bg-white/10 transition-colors"
            >
              <span class="material-symbols-outlined">remove</span>
            </button>
          </div>
        </div>
      </section>

      <footer class="px-4 pb-6">
        <button
          onclick="resetGame()"
          class="w-full h-16 bg-white text-background-dark rounded-2xl font-black uppercase tracking-[0.2em] shadow-xl active:scale-95 transition-transform"
        >
          Nova Partida
        </button>
      </footer>
    </main>

    <div
      id="settingsModal"
      onclick="closeSettings()"
      class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 px-4"
    >
      <div class="bg-card-dark rounded-2xl p-6 w-full max-w-sm space-y-4" onclick="event.stopPropagation()">
        <h2 class="text-lg font-black uppercase tracking-wide">
          Configurações
        </h2>

        <!-- Tipo de pontuação -->
        <div>
          <label class="text-xs uppercase opacity-60">Pontuação</label>
          <select
            id="scoringMode"
            class="w-full mt-1 bg-card-dark text-white rounded-xl p-3 border border-white/10 focus:outline-none focus:ring-2 focus:ring-primary"
          >
            <option value="official">Oficial (15,30,40)</option>
            <option value="simplified">Simplificada (1,2,3)</option>
          </select>
        </div>
<div class="flex items-center justify-between">
  <label class="text-xs uppercase opacity-60">
    Sets para Vencer
  </label>
  <button id="toggleSets"
    onclick="toggleSetsEnabled()"
    class="w-12 h-6 rounded-full bg-white/10 relative transition-colors">
    <span id="toggleCircle"
      class="absolute left-1 top-1 w-4 h-4 rounded-full bg-white transition-transform">
    </span>
  </button>
</div>

        <!-- Sets para vencer -->
        <div>
<div id="setsInputWrapper" class="mt-3 hidden">
  <input id="setsToWin"
    type="number"
    min="1"
    step="1"
    placeholder="Ex: 3"
    class="w-full mt-1 bg-card-dark text-white rounded-xl p-3
           border border-white/10 focus:outline-none focus:ring-2 focus:ring-primary">
</div>

        </div>

        <button
          onclick="applySettings()"
          class="w-full h-12 bg-primary text-background-dark rounded-xl font-black"
        >
          Salvar
        </button>
      </div>
    </div>

    <div
      id="winnerModal"
      onclick="closeWinner()"
      class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 px-4"
    >
      <div class="bg-card-dark rounded-2xl p-6 w-full max-w-sm space-y-4"
      onclick="event.stopPropagation()"">
        <h2 class="text-xl font-black text-center">
  🏆 FIM DE PARTIDA 🏆
</h2>

        <p class="text-lg font-bold text-center">
  <span id="winnerName"></span>
  <span class="text-white"> venceu a partida</span>
</p>



        <button
          onclick="
            resetGame()
            closeWinner()
          "
          class="w-full h-12 bg-primary text-background-dark rounded-xl font-black"
        >
          Nova Partida
        </button>
      </div>
    </div>

    <script src="script.js"></script>

    <div id="installPrompt"
  class="fixed bottom-24 left-1/2 -translate-x-1/2 hidden z-50
         bg-card-dark text-white px-5 py-4 rounded-2xl shadow-xl
         flex items-center gap-4 max-w-sm w-[90%]">

  <span class="material-symbols-outlined text-3xl text-primary">
    download
  </span>

  <div class="flex-1">
    <p class="font-bold text-sm">Instalar App</p>
    <p class="text-xs opacity-70">
      Adicione o placar à tela inicial
    </p>
  </div>

<div class="flex flex-col gap-2 items-end">
  <button onclick="installApp()"
    class="bg-primary text-background-dark px-4 py-2 rounded-xl font-bold">
    Instalar
  </button>

  <button onclick="dismissInstallPrompt()"
    class="text-[10px] uppercase tracking-widest opacity-50 hover:opacity-80">
    Não mostrar novamente
  </button>
</div>
</div>

  </body>
</html>
